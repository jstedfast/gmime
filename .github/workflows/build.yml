name: C/C++ CI

on:
  push:
    branches: [ "master", "v4.0-dev" ]
  pull_request:
    branches: [ "master", "v4.0-dev" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 GCC / full integration
            os: ubuntu-26.04
            arch: x86_64
            cc: gcc
            features: enabled
            backend: AVX2
            integration: true
          - name: Linux x64 GCC / minimal
            os: ubuntu-26.04
            arch: x86_64
            cc: gcc
            features: disabled
            backend: AVX2
          - name: Linux x64 GCC / GLib 2.70.2
            os: ubuntu-22.04
            arch: x86_64
            cc: gcc
            features: enabled
            backend: AVX2
            minimum_glib: true
          - name: Linux ARM64 GCC
            os: ubuntu-26.04-arm
            arch: aarch64
            cc: gcc
            features: enabled
            backend: NEON
          - name: macOS 15 ARM64 Clang
            os: macos-15
            arch: arm64
            cc: clang
            features: enabled
            backend: NEON
          - name: macOS 15 ARM64 Clang / minimal debug
            os: macos-15
            arch: arm64
            cc: clang
            features: disabled
            backend: NEON
            buildtype: debug
          - name: macOS 26 ARM64 Clang
            os: macos-26
            arch: arm64
            cc: clang
            features: enabled
            backend: NEON
          - name: macOS 26 ARM64 Clang / minimal
            os: macos-26
            arch: arm64
            cc: clang
            features: disabled
            backend: NEON
          - name: Linux x64 Clang / ASan + UBSan
            os: ubuntu-26.04
            arch: x86_64
            cc: clang
            features: enabled
            backend: AVX2
            sanitize: true
          - name: Linux x64 GCC / static
            os: ubuntu-26.04
            arch: x86_64
            cc: gcc
            features: disabled
            backend: AVX2
            static: true
    defaults:
      run:
        shell: bash
    env:
      CC: ${{ matrix.cc }}
      GMIME_TEST_REQUIRE_READER_BACKEND: ${{ matrix.backend }}
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
    steps:
    - uses: actions/checkout@v7
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get -y install meson ninja-build pkg-config clang \
          libglib2.0-dev libidn2-dev libgpgme-dev zlib1g-dev gnupg gpgsm
        if [[ '${{ matrix.integration }}' == 'true' ]]; then
          sudo apt-get -y install gtk-doc-tools valac gobject-introspection \
            libgirepository1.0-dev python3-gi
        fi
        if [[ '${{ matrix.minimum_glib }}' == 'true' ]]; then
          sudo apt-get -y install libpcre3-dev libffi-dev python3-venv
          python3 -m venv "$RUNNER_TEMP/meson-env"
          "$RUNNER_TEMP/meson-env/bin/pip" install 'meson==1.3.2'
          echo "$RUNNER_TEMP/meson-env/bin" >> "$GITHUB_PATH"
        fi
    - name: Build minimum supported GLib
      if: matrix.minimum_glib
      run: |
        cd "$RUNNER_TEMP"
        curl --fail --location --retry 3 \
          https://download.gnome.org/sources/glib/2.70/glib-2.70.2.tar.xz \
          -o glib-2.70.2.tar.xz
        echo '0551459c85cd3da3d58ddc9016fd28be5af503f5e1615a71ba5b512ac945806f  glib-2.70.2.tar.xz' | sha256sum --check
        tar -xf glib-2.70.2.tar.xz
        meson setup glib-build glib-2.70.2 --prefix="$RUNNER_TEMP/glib-prefix" \
          --libdir=lib --buildtype=release --wrap-mode=nofallback \
          -Dtests=false -Dinstalled_tests=false -Dgtk_doc=false -Dman=false \
          -Dselinux=disabled -Dlibmount=disabled
        meson compile -C glib-build -j 2
        meson install -C glib-build
        echo "PKG_CONFIG_PATH=$RUNNER_TEMP/glib-prefix/lib/pkgconfig" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$RUNNER_TEMP/glib-prefix/lib" >> "$GITHUB_ENV"
    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      run: |
        brew install meson ninja pkgconf glib libidn2 gpgme gnupg libiconv
        echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig" >> "$GITHUB_ENV"
    - name: Verify architecture and report toolchain
      run: |
        test "$(uname -m)" = '${{ matrix.arch }}'
        uname -a
        "$CC" --version
        meson --version
        ninja --version
        pkg-config --modversion glib-2.0 gobject-2.0 gio-2.0 zlib gpgme libidn2
        if [[ '${{ matrix.minimum_glib }}' == 'true' ]]; then
          for package in glib-2.0 gobject-2.0 gio-2.0 gthread-2.0; do
            test "$(pkg-config --modversion "$package")" = '2.70.2'
          done
        fi
        gpg --version
    - name: Configure build with assertions
      run: |
        extra=(-Dintrospection=disabled -Dvapi=disabled -Dgtk_doc=false)
        if [[ '${{ matrix.integration }}' == 'true' ]]; then
          extra=(-Dintrospection=enabled -Dvapi=enabled -Dgtk_doc=true)
        fi
        if [[ '${{ matrix.sanitize }}' == 'true' ]]; then
          # Clang resolves shared-library sanitizer symbols in the executable.
          extra+=(-Db_sanitize=address,undefined -Db_lundef=false)
        fi
        if [[ '${{ matrix.static }}' == 'true' ]]; then
          extra+=(-Ddefault_library=static)
        fi
        if [[ '${{ runner.os }}' == 'macOS' ]]; then
          extra+=("-Diconv_prefix=$(brew --prefix libiconv)")
        fi
        meson setup _build --buildtype='${{ matrix.buildtype || 'debugoptimized' }}' -Db_ndebug=false \
          --prefix="$RUNNER_TEMP/gmime-prefix" --libdir=lib \
          -Dcrypto='${{ matrix.features }}' -Dlibidn='${{ matrix.features }}' "${extra[@]}"
    - name: Build
      run: meson compile -C _build
    - name: Report and require native SIMD coverage
      run: meson test -C _build --no-rebuild --verbose test-reader-simd test-reader-simd-scalar test-reader-bytes test-reader-bytes-scalar
    - name: Test
      run: meson test -C _build --print-errorlogs
    - name: Build documentation
      if: matrix.integration
      run: meson compile -C _build gmime-doc
    - name: Test source distribution
      if: matrix.integration
      run: meson dist -C _build
    - name: Stage and verify installation
      if: matrix.integration || matrix.static || runner.os == 'macOS'
      run: |
        meson install -C _build --destdir "$RUNNER_TEMP/gmime-stage"
        test -f "$RUNNER_TEMP/gmime-stage$RUNNER_TEMP/gmime-prefix/include/gmime-4.0/gmime/gmime.h"
        # A real private prefix lets pkg-config resolve system dependencies
        # without applying the staged sysroot to GLib and other dependencies.
        meson install -C _build
        extra=()
        if [[ '${{ matrix.integration }}' == 'true' ]]; then extra+=(--bindings); fi
        if [[ '${{ matrix.static }}' == 'true' ]]; then extra+=(--static); fi
        python3 tools/check-installed.py "$RUNNER_TEMP/gmime-prefix" "${extra[@]}"
    - name: Upload failure logs
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: logs-${{ strategy.job-index }}
        path: |
          _build/meson-logs/
          _build/meson-private/dist-build/meson-logs/
          _build/meson-dist/
          ${{ runner.temp }}/glib-build/meson-logs/
        if-no-files-found: ignore

  coverage:
    name: Linux x64 GCC / coverage
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
    env:
      CC: gcc
      GMIME_TEST_REQUIRE_READER_BACKEND: AVX2
    steps:
    - uses: actions/checkout@v7
    - name: Install coverage dependencies
      run: |
        sudo apt-get update
        sudo apt-get -y install meson ninja-build pkg-config gcc gcovr \
          libglib2.0-dev libidn2-dev libgpgme-dev zlib1g-dev gnupg gpgsm
    - name: Configure coverage build
      run: |
        meson setup _build --buildtype=debug -Db_ndebug=false -Db_coverage=true \
          -Dcrypto=enabled -Dlibidn=enabled -Dintrospection=disabled -Dvapi=disabled \
          -Dgtk_doc=false -Dexamples=false -Dtests=true
    - name: Build
      run: meson compile -C _build
    - name: Test
      run: meson test -C _build --no-rebuild --suite core --suite crypto --num-processes 1 --print-errorlogs
    - name: Generate library coverage reports
      run: |
        gcovr _build --root . --filter '^gmime/' --filter '^util/' --print-summary \
          --lcov _build/coverage.info --html-details _build/coverage.html
    - name: Upload coverage to Coveralls
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        file: _build/coverage.info
        format: lcov
    - name: Upload coverage reports and test logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage
        path: |
          _build/coverage*
          _build/meson-logs/
