name: Fuzz

on:
  schedule:
    # Match MimeKit's nightly schedule.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Seconds to fuzz each target (1-14400)'
        default: '600'
        type: string
      target:
        description: 'Fuzz target'
        default: all
        type: choice
        options: [all, mime-reader, mime-parser, encoders, decoders, rfc2047, structured-headers, smtp-address-validator, tnef-reader, tnef-message, filters, compliance-validators, html-tokenizer, text-converters, rtf-compressed, rtf-tokenizer, rtf-converters, dns-records, dkim-arc-verifier, dmarc-verifier]

permissions:
  contents: read

jobs:
  formatting-regressions:
    if: github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == 'html-tokenizer'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build formatting regression tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config libglib2.0-dev zlib1g-dev
          meson setup _build -Dfuzzing=replay -Dtests=true -Dcrypto=disabled -Ddkim-crypto=disabled \
            -Dlibidn=disabled -Dintrospection=disabled -Dvapi=disabled -Dgtk_doc=false -Dexamples=false
          ninja -C _build fuzzing/gmime-fuzz tests/test-html-converters
      - name: Compare whole-input and fragmented tokenizer traces
        shell: bash
        run: |
          set -o pipefail
          _build/fuzzing/gmime-fuzz --measure-html-formatting \
            tests/data/html-converters/{planet-fitness,homedepot-check-inside-now,mimekit.net,formatting-fallback}.html \
            | tee formatting-results.tsv
      - name: Publish comparison results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: formatting-regression-results
          path: formatting-results.tsv
      - name: Check converter recovery and literal fallback
        run: _build/tests/test-html-converters -p /html-converters/formatting-recovery-fallback

  targets:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      duration: ${{ steps.targets.outputs.duration }}
    steps:
      - name: Select targets and validate duration
        id: targets
        env:
          TARGET: ${{ inputs.target || 'all' }}
          DURATION: ${{ inputs.duration || '3600' }}
        run: |
          python3 - <<'PY'
          import json, os
          targets = ["mime-reader", "mime-parser", "encoders", "decoders", "rfc2047", "structured-headers", "smtp-address-validator", "tnef-reader", "tnef-message", "filters", "compliance-validators", "html-tokenizer", "text-converters", "rtf-compressed", "rtf-tokenizer", "rtf-converters", "dns-records", "dkim-arc-verifier", "dmarc-verifier"]
          target = os.environ["TARGET"]
          duration = os.environ["DURATION"]
          if target != "all" and target not in targets:
              raise SystemExit("Unknown fuzz target")
          if not duration.isascii() or not duration.isdecimal() or not 1 <= int(duration) <= 14400:
              raise SystemExit("Duration must be an integer from 1 to 14400 seconds")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps(targets if target == "all" else [target]) + "\n")
              output.write("duration=" + duration + "\n")
          PY

  fuzz:
    needs: targets
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      CC: clang
      TARGET: ${{ matrix.target }}
      DURATION: ${{ needs.targets.outputs.duration }}
      CORPUS_PATH: _build-fuzz/artifacts/${{ matrix.target }}/corpus
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-rt-dev meson ninja-build \
            pkg-config libglib2.0-dev zlib1g-dev libgnutls28-dev

      # Caches are immutable: restore the newest corpus, then save a new key.
      - name: Restore corpus
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CORPUS_PATH }}
          key: gmime-fuzz-v1-${{ matrix.target }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: gmime-fuzz-v1-${{ matrix.target }}-${{ github.ref_name }}-

      - name: Configure and build
        run: |
          clang --version
          meson setup _build-fuzz --buildtype=debugoptimized \
            -Dfuzzing=libfuzzer -Ddefault_library=static \
            -Db_sanitize=address,undefined -Db_ndebug=false \
            -Dcrypto=disabled -Ddkim-crypto=gnutls -Dlibidn=disabled -Dintrospection=disabled \
            -Dvapi=disabled -Dgtk_doc=false -Dexamples=false -Dtests=false
          meson compile -C _build-fuzz

      - name: Replay regression seeds
        run: meson test -C _build-fuzz --suite fuzzing --print-errorlogs "fuzz-replay-$TARGET"

      - name: Merge seeds into working corpus
        run: python3 fuzzing/seed-corpora.py _build-fuzz/artifacts --target "$TARGET"

      - name: Fuzz
        id: fuzz
        run: |
          case "$TARGET" in
            encoders) max_len=262144; dictionary=codecs ;;
            decoders) max_len=1048576; dictionary=codecs ;;
            rfc2047) max_len=65536; dictionary=mime ;;
            structured-headers) max_len=65536; dictionary=structured-headers ;;
            dkim-arc-verifier|dmarc-verifier) max_len=65536; dictionary=dkim ;;
            dns-records) max_len=16384; dictionary=dkim ;;
            smtp-address-validator) max_len=4096; dictionary=smtp-address-validator ;;
            tnef-reader) max_len=1048576; dictionary=tnef ;;
            tnef-message) max_len=4194304; dictionary=tnef ;;
            filters) max_len=262144; dictionary=filters ;;
            compliance-validators) max_len=262144; dictionary=mime ;;
            text-converters) max_len=262144; dictionary=text ;;
            html-tokenizer) max_len=262144; dictionary=html ;;
            rtf-compressed) max_len=1048576; dictionary=rtf-compressed ;;
            rtf-converters|rtf-tokenizer) max_len=1048576; dictionary=rtf ;;
            *) max_len=1048576; dictionary=mime ;;
          esac
          "_build-fuzz/fuzzing/fuzz-$TARGET" \
            -dict="fuzzing/$dictionary.dict" -max_len="$max_len" -timeout=10 \
            -rss_limit_mb=2048 -max_total_time="$DURATION" -print_final_stats=1 \
            -artifact_prefix="_build-fuzz/artifacts/$TARGET/crashes/" \
            "$CORPUS_PATH" 2>&1 | tee "_build-fuzz/artifacts/$TARGET/fuzz.log"

      - name: Save corpus
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CORPUS_PATH }}
          key: gmime-fuzz-v1-${{ matrix.target }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload crashes and failure logs
        id: crashes
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}-crashes
          path: |
            _build-fuzz/artifacts/${{ matrix.target }}/crashes/
            _build-fuzz/artifacts/${{ matrix.target }}/fuzz.log
            _build-fuzz/meson-logs/
          if-no-files-found: ignore
          retention-days: 30

      - name: Report fuzzing failure
        if: failure() && !cancelled() && steps.fuzz.outcome == 'failure'
        uses: actions/github-script@v8
        env:
          CRASH_ARTIFACT_URL: ${{ steps.crashes.outputs.artifact-url }}
        with:
          script: |
            const fs = require('node:fs');
            const target = process.env.TARGET;
            const dir = `_build-fuzz/artifacts/${target}/crashes`;
            const crashes = fs.existsSync(dir) && fs.readdirSync(dir, { withFileTypes: true })
              .some(entry => entry.isFile() && /^(crash-|deadly-signal|timeout-|oom-)/.test(entry.name));
            if (!crashes) {
              core.info('No crashing input; skipping issue reporting.');
              return;
            }

            const { owner, repo } = context.repo;
            const marker = `<!-- gmime-fuzz:${target} -->`;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}/attempts/${process.env.GITHUB_RUN_ATTEMPT}`;
            const artifact = process.env.CRASH_ARTIFACT_URL;
            const body = [
              marker, `Fuzzing found a failing input for **${target}**.`, '',
              `Commit: ${context.sha}`, `Workflow run: ${run}`,
              artifact ? `Crashing inputs and logs (retained for 30 days): ${artifact}`
                       : 'No artifact is available; see the workflow logs.'
            ].join('\n');

            const issues = github.rest.issues;
            for await (const { data } of github.paginate.iterator(issues.listForRepo, { owner, repo, state: 'open', per_page: 100 })) {
              const prior = data.find(i => !i.pull_request && i.body?.startsWith(marker));
              if (prior) {
                await issues.createComment({ owner, repo, issue_number: prior.number, body });
                return;
              }
            }
            await issues.create({ owner, repo, title: `Fuzzing failure: ${target}`, body });
